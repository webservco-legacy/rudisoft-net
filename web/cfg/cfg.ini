; Main configuration
; Set these to 1/0 for TRUE/FALSE
[Config]
; Report application errors
Errors = 1
; Use database
Database = 0
; Use sessions and users
Sessions = 0
; Use user authentication
Users = 0
; Use fake file extension for URL's
Fakext = 1

; Paths
; must end in a slash (/)
[Paths]
; Engine path
;Engine = "/var/www/rudisoft.net/web/rwlib/"
Engine = "d:/home/rudisoft/www/rudisoft.php/public_html/rudisoft.net/rwlib/"
; Application path
;App = "/var/www/rudisoft.net/web/"
App = "d:/home/rudisoft/www/rudisoft.php/public_html/rudisoft.net/"
; Application URL
;AppURL = "http://www.rudisoft.net/"
AppURL = "http://rudisoft.php/rudisoft.net/"

; Database configuration
[Database]
Type = "mysql"
Host = "localhost"
Port = "3306"
User = "test"
Pass = "REDACTED"
Name = "test"

; Application information
[AppInfo]
Name   = "RudiSoft.Net"
Author = "Radu Maier"
Prefix = "rs"

; Default application configuration
[Defaults]
; Combined with the SeoURLs extension
; this provides full SEO functionality
; by removing 'index.php' from URLs.
; If mod_rewrite is available, set this to 1
FullSEO = 1
; Default language
Language = "ro"
; Default template engine (Smarty/rudweb)
TemplateEngine = "Smarty"
; Default skin (dir name)
Skin = "rudisoft_s"
; Default timezone (http://www.php.net/timezones)
TimeZone = "Europe/Bucharest"
; Served content type
; default "text"
; values "text/image/BLANK(text)"
; you can override this in invidual pages
CntType = "text"
; Main layout template directory.
; default ""
; values "BLANK/DIR_NAME"
; you can override this in invidual pages
SkinDir = ""
; Main layout template file
; default BLANK = "layout"
; values "TPL_NAME"
; you can override this in invidual pages
SkinTpl = ""

; Extensions to load
; Only put here extensions you want loaded.
; No value required (ignored anyway)
[Extensions]
SeoURLs = 1
Sessions = 1
Users = 1
Captcha = 1
Thumb = 1
delFD = 1